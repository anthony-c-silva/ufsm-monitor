name: CI

# Builda e valida tudo a cada push/PR — pega erro no GitHub antes de o servidor
# puxar o código (o deploy é pull-based; ver deploy/README.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  controlador:
    name: Controlador (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: controller/requirements.txt
      - name: Instalar dependências
        run: pip install -r controller/requirements.txt
      - name: Checagem de sintaxe
        run: python -m compileall -q controller/app
      - name: Import da aplicação (sem banco)
        working-directory: controller
        run: python -c "import app.main; print('controlador OK —', len(app.main.app.routes), 'rotas')"

  # ---------------------------------------------------------------------------
  dashboard:
    name: Dashboard (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: web
        run: npm run build

  # ---------------------------------------------------------------------------
  agente:
    name: Agente (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum
      - name: Vet
        working-directory: agent
        run: go vet ./...
      - name: Build (nativo + cross-compile ARM64 do Raspberry Pi)
        working-directory: agent
        run: |
          go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/agent-arm64 ./cmd/ufsm-monitor-agent
          echo "binário arm64 gerado: $(ls -la /tmp/agent-arm64 | awk '{print $5}') bytes"

  # ---------------------------------------------------------------------------
  imagens-docker:
    name: Build das imagens (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build de todas as imagens (controlador, ingestão, web, agente)
        run: docker compose --profile demo build
